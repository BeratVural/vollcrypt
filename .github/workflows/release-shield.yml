name: Vollcrypt Shield Release

on:
  push:
    tags:
      - "shield-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Shield release tag (for example shield-v1.0.0)"
        required: true
        type: string
      create_draft:
        description: "Create the GitHub draft after all qualification gates pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  platform-qualification:
    name: Agent qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, windows-2022, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Test agent and CLI
        run: cargo test --locked -p vollcrypt-shield-core -p vollcrypt-shield-protocol -p vollcrypt-shield-fs -p vollcrypt-shield-cli
      - name: Drill state migration and break-glass recovery
        run: |
          cargo test --locked -p vollcrypt-shield-fs release_upgrade_migration_downgrade_and_backup_restore_drill
          cargo test --locked -p vollcrypt-shield-fs release_break_glass_recovery_drill
      - name: Drill Unix baseline-vault rollback
        if: runner.os == 'Linux'
        run: cargo test --locked -p vollcrypt-shield-fs release_backup_rollback_and_break_glass_recovery_drill
      - name: Build release CLI
        run: cargo build --locked --release -p vollcrypt-shield-cli
      - name: Install and remove native DEB package
        if: runner.os == 'Linux'
        run: sudo bash vollcrypt-shield/scripts/linux-qualification.sh target/release/vollcrypt-shield release deb

  windows-recovery:
    name: Windows recovery (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-server-2022-x86_64
            runner: windows-2022
          - platform: windows-server-2025-x86_64
            runner: windows-2025
          - platform: windows-11-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Run strict recovery gate
        shell: pwsh
        run: ./vollcrypt-shield/scripts/windows-recovery-qualification.ps1 -EvidenceDirectory "qualification-evidence/${{ matrix.platform }}"
      - name: Upload exact-commit recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualification-recovery-${{ matrix.platform }}
          path: qualification-evidence/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 90

  cli:
    name: CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            binary: vollcrypt-shield
          - os: windows-2022
            platform: windows-x86_64
            binary: vollcrypt-shield.exe
          - os: windows-11-arm
            platform: windows-arm64
            binary: vollcrypt-shield.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build CLI
        run: cargo build --locked --release -p vollcrypt-shield-cli
      - name: Stage CLI
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/vollcrypt-shield-${{ matrix.platform }}${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Attest CLI
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shield-cli-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  deb-package:
    name: Native DEB package
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build CLI
        run: cargo build --locked --release -p vollcrypt-shield-cli
      - name: Build native package
        run: bash vollcrypt-shield/scripts/build-linux-package.sh target/release/vollcrypt-shield dist deb
      - name: Install and remove package
        run: sudo bash vollcrypt-shield/scripts/linux-qualification.sh target/release/vollcrypt-shield release deb
      - name: Attest DEB package
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: dist/*.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shield-native-deb-linux-x86_64
          path: dist/*.deb
          if-no-files-found: error

  rpm-package:
    name: Native RPM package
    runs-on: ubuntu-24.04
    container:
      image: rockylinux/rockylinux:9.6@sha256:91bbb8eb52ca462611c1f9ce5c4cede4172a31bfe64f336e82f29648694a3cfe
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Install system dependencies
        shell: bash
        run: dnf install -y bash ca-certificates findutils gcc gcc-c++ git make openssl-devel pkgconf-pkg-config rpm-build shadow-utils systemd tar gzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build CLI
        run: cargo build --locked --release -p vollcrypt-shield-cli
      - name: Build native package
        run: bash vollcrypt-shield/scripts/build-linux-package.sh target/release/vollcrypt-shield dist rpm
      - name: Install and remove package
        run: bash vollcrypt-shield/scripts/linux-qualification.sh target/release/vollcrypt-shield release rpm
      - name: Attest RPM package
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: dist/*.rpm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shield-native-rpm-linux-x86_64
          path: dist/*.rpm
          if-no-files-found: error

  viewer:
    name: Viewer (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            architecture: x86_64
          - os: windows-2022
            platform: windows-x86_64
            architecture: x86_64
          - os: windows-11-arm
            platform: windows-arm64
            architecture: arm64
    defaults:
      run:
        working-directory: vollcrypt-shield/desktop-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vollcrypt-shield/desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install dependencies
        run: npm ci
      - name: Build Viewer bundles
        run: npm run tauri build
      - name: Install and remove Windows Viewer
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not produced' }
          ./vollcrypt-shield/scripts/windows-installer-smoke.ps1 -Installer $installer.FullName -ExpectedArchitecture ${{ matrix.architecture }} -EvidenceFile dist/installer-smoke-${{ matrix.platform }}.json
      - name: Stage Viewer bundles
        shell: bash
        run: |
          mkdir -p ../../dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            find ../../target/release/bundle/nsis -maxdepth 1 -type f -name "*-setup.exe" -exec cp {} ../../dist/ \;
            cp ../../target/release/vollcrypt-shield-viewer.exe ../../dist/vollcrypt-shield-viewer-${{ matrix.platform }}-portable.exe
          else
            find ../../target/release/bundle/deb -maxdepth 1 -type f -name "*.deb" -exec cp {} ../../dist/ \;
            find ../../target/release/bundle/appimage -maxdepth 1 -type f -name "*.AppImage" -exec cp {} ../../dist/ \;
          fi
          test "$(find ../../dist -maxdepth 1 -type f | wc -l)" -ge 2
      - name: Attest Viewer
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shield-viewer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  watcher-soak:
    name: Watcher release soak
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Test webhook and durable log burst
        run: cargo test --locked -p vollcrypt-shield-fs notification_delivery_soak
      - name: Build release CLI
        run: cargo build --locked --release -p vollcrypt-shield-cli
      - name: Run five-minute live watcher soak
        run: bash vollcrypt-shield/scripts/watcher-soak.sh target/release/vollcrypt-shield 300

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/') || inputs.create_draft == true
    needs: [platform-qualification, windows-recovery, cli, deb-package, rpm-package, viewer, watcher-soak]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: shield-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release-assets/*
          draft: true
          generate_release_notes: true
