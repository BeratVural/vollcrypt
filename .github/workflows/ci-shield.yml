name: Vollcrypt Shield CI

on:
  push:
    branches: ["main"]
    paths:
      - "vollcrypt-shield/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-shield.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "vollcrypt-shield/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-shield.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-2025]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Shield
        run: cargo test --locked -p vollcrypt-shield-core -p vollcrypt-shield-protocol -p vollcrypt-shield-witness -p vollcrypt-shield-fs -p vollcrypt-shield-container -p vollcrypt-shield-db -p vollcrypt-shield-embedded -p vollcrypt-shield-cli -p vollcrypt-scan-core -p vollcrypt-shield-classifier

  embedded-no-std:
    name: Embedded no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv8m.main-none-eabihf
          - thumbv7em-none-eabihf
          - riscv32imac-unknown-none-elf
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check zero-allocation embedded core
        run: cargo check --locked -p vollcrypt-shield-embedded --target ${{ matrix.target }}

  quality:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Enforce public and commercial source boundary
        shell: bash
        run: |
          test "$(git ls-files vollcrypt-shield/control-plane)" = "vollcrypt-shield/control-plane/README.md"
          ! git grep -n 'name = "vollcrypt-shield-control-plane"' -- ':!vollcrypt-shield/control-plane/README.md'

      - name: Lint Shield
        run: cargo clippy --locked -p vollcrypt-shield-core -p vollcrypt-shield-protocol -p vollcrypt-shield-witness -p vollcrypt-shield-fs -p vollcrypt-shield-container -p vollcrypt-shield-db -p vollcrypt-shield-embedded -p vollcrypt-shield-cli -p vollcrypt-shield-core-node -p vollcrypt-scan-core -p vollcrypt-shield-classifier --all-targets -- -D warnings

  node-binding:
    name: Node Binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-2025]
    defaults:
      run:
        working-directory: vollcrypt-shield/bindings/node
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vollcrypt-shield/bindings/node/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build binding
        run: npm run build

      - name: Test binding
        run: npm test

  viewer:
    name: Shield Viewer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-2025]
    defaults:
      run:
        working-directory: vollcrypt-shield/desktop-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vollcrypt-shield/desktop-app/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Test independent verifier
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Viewer backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
