name: Vollcrypt Shield CI

on:
  push:
    branches: ["main", "shield"]
    paths:
      - "vollcrypt-shield/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-shield.yml"
      - ".github/workflows/release-shield.yml"
  pull_request:
    branches: ["main", "shield"]
    paths:
      - "vollcrypt-shield/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci-shield.yml"
      - ".github/workflows/release-shield.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, windows-2022, windows-2025]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Test Shield
        run: cargo test --locked -p vollcrypt-shield-core -p vollcrypt-shield-protocol -p vollcrypt-shield-witness -p vollcrypt-shield-windows -p vollcrypt-shield-fs -p vollcrypt-shield-container -p vollcrypt-shield-db -p vollcrypt-shield-embedded -p vollcrypt-shield-cli -p vollcrypt-scan-core -p vollcrypt-shield-classifier

  embedded-no-std:
    name: Embedded no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv8m.main-none-eabihf
          - thumbv7em-none-eabihf
          - riscv32imac-unknown-none-elf
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Check zero-allocation embedded core
        run: cargo check --locked -p vollcrypt-shield-embedded --target ${{ matrix.target }}

  docker-runtime-qualification:
    name: Shield (Docker host monitor)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build container host agent
        run: cargo build --locked --release -p vollcrypt-shield-container

      - name: Qualify approved and unapproved runtime images
        shell: bash
        run: |
          set -euo pipefail
          state="$(mktemp -d)"
          cleanup() {
            docker rm -f shield-approved shield-unapproved >/dev/null 2>&1 || true
            case "$state" in
              /tmp/tmp.*) rm -rf -- "$state" ;;
            esac
          }
          trap cleanup EXIT

          docker pull alpine:3.20
          docker pull busybox:1.36
          approved_digest="$(docker image inspect alpine:3.20 --format '{{.Id}}')"
          bin=target/release/vollcrypt-shield-container
          "$bin" init --state-dir "$state" --scope docker-runtime-ci
          "$bin" approve-docker --state-dir "$state" \
            --image-digest "$approved_digest"

          docker run -d --name shield-approved alpine:3.20 sleep 120
          "$bin" watch-docker --state-dir "$state" --max-observations 1 \
            | tee "$state/approved.jsonl"
          grep -q '"approved":true' "$state/approved.jsonl"

          docker run -d --name shield-unapproved busybox:1.36 sleep 120
          set +e
          "$bin" watch-docker --state-dir "$state" --max-observations 2 \
            >"$state/unapproved.jsonl"
          status=$?
          set -e
          test "$status" -eq 2
          grep -q '"approved":false' "$state/unapproved.jsonl"
          "$bin" runtime-audit-verify --state-dir "$state" \
            | grep -q '"status": "valid"'

  containerd-runtime-qualification:
    name: Shield (containerd host monitor)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build container host agent
        run: cargo build --locked --release -p vollcrypt-shield-container

      - name: Qualify containerd inventory and signed evidence
        shell: bash
        run: |
          set -euo pipefail
          namespace=shield-ci
          state="$(mktemp -d)"
          cleanup() {
            sudo ctr --namespace "$namespace" tasks kill --signal SIGKILL shield-approved >/dev/null 2>&1 || true
            sudo ctr --namespace "$namespace" tasks kill --signal SIGKILL shield-unapproved >/dev/null 2>&1 || true
            sudo ctr --namespace "$namespace" tasks rm shield-approved >/dev/null 2>&1 || true
            sudo ctr --namespace "$namespace" tasks rm shield-unapproved >/dev/null 2>&1 || true
            sudo ctr --namespace "$namespace" containers rm shield-approved >/dev/null 2>&1 || true
            sudo ctr --namespace "$namespace" containers rm shield-unapproved >/dev/null 2>&1 || true
            sudo ctr namespaces rm "$namespace" >/dev/null 2>&1 || true
            case "$state" in
              /tmp/tmp.*) sudo rm -rf -- "$state" ;;
            esac
          }
          trap cleanup EXIT

          sudo test -S /run/containerd/containerd.sock
          sudo ctr namespaces create "$namespace"
          sudo ctr --namespace "$namespace" images pull docker.io/library/alpine:3.20
          sudo ctr --namespace "$namespace" images pull docker.io/library/busybox:1.36
          approved_digest="$(sudo ctr --namespace "$namespace" images ls \
            | awk '$1 == "docker.io/library/alpine:3.20" { print $3 }')"
          test "${approved_digest#sha256:}" != "$approved_digest"

          bin="$PWD/target/release/vollcrypt-shield-container"
          sudo "$bin" init --state-dir "$state" --scope containerd-runtime-ci
          sudo "$bin" approve-containerd --state-dir "$state" \
            --namespace "$namespace" --image-digest "$approved_digest"
          sudo "$bin" watch-containerd --state-dir "$state" --max-observations 1 \
            >/tmp/shield-containerd-approved.jsonl &
          approved_watcher=$!
          sleep 2
          sudo ctr --namespace "$namespace" run -d \
            docker.io/library/alpine:3.20 shield-approved sleep 120
          wait "$approved_watcher"
          grep -q '"approved":true' /tmp/shield-containerd-approved.jsonl
          sudo ctr --namespace "$namespace" tasks kill --signal SIGKILL shield-approved
          sudo ctr --namespace "$namespace" tasks rm shield-approved
          sudo ctr --namespace "$namespace" containers rm shield-approved

          sudo "$bin" watch-containerd --state-dir "$state" --max-observations 1 \
            >/tmp/shield-containerd-unapproved.jsonl &
          rejected_watcher=$!
          sleep 2
          sudo ctr --namespace "$namespace" run -d \
            docker.io/library/busybox:1.36 shield-unapproved sleep 120
          set +e
          wait "$rejected_watcher"
          status=$?
          set -e
          test "$status" -eq 2
          grep -q '"approved":false' /tmp/shield-containerd-unapproved.jsonl
          sudo "$bin" runtime-audit-verify --state-dir "$state" \
            --runtime containerd | grep -q '"status": "valid"'

  sidecar-qualification:
    name: Shield (constrained sidecar)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build container sidecar
        run: cargo build --locked --release -p vollcrypt-shield-container

      - name: Qualify constrained evidence and readiness
        shell: bash
        run: |
          set -euo pipefail
          state="$(mktemp -d)"
          evidence="$state/../shield-sidecar-evidence.json"
          bin="$PWD/target/release/vollcrypt-shield-container"
          digest="sha256:$(printf a%.0s {1..64})"
          cleanup() {
            if test -n "${sidecar_pid:-}"; then
              kill "$sidecar_pid" >/dev/null 2>&1 || true
              wait "$sidecar_pid" >/dev/null 2>&1 || true
            fi
            case "$state" in
              /tmp/tmp.*) rm -rf -- "$state" ;;
            esac
            rm -f -- "$evidence"
          }
          trap cleanup EXIT

          "$bin" init --state-dir "$state" --scope sidecar-ci
          "$bin" approve-sidecar --state-dir "$state" \
            --binding default/app --image-digest "$digest"
          printf '{"version":1,"podUid":"pod-ci","namespace":"default","containerName":"app","imageDigest":"%s"}' \
            "$digest" >"$evidence"
          "$bin" sidecar-check --state-dir "$state" --evidence-file "$evidence" \
            | grep -q '"guaranteeLevel": "constrained"'

          "$bin" serve-sidecar --state-dir "$state" \
            --evidence-file "$evidence" --listen 127.0.0.1:9464 \
            --poll-seconds 1 &
          sidecar_pid=$!
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:9464/readyz >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:9464/readyz \
            | grep -q '"assurance":"constrained"'

          rejected="sha256:$(printf b%.0s {1..64})"
          printf '{"version":1,"podUid":"pod-ci","namespace":"default","containerName":"app","imageDigest":"%s"}' \
            "$rejected" >"$evidence"
          for attempt in {1..20}; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:9464/readyz)"
            test "$code" = 503 && break
            sleep 0.25
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:9464/readyz)" = 503
          kill "$sidecar_pid"
          wait "$sidecar_pid" || true
          sidecar_pid=
          "$bin" runtime-audit-verify --state-dir "$state" --runtime sidecar \
            | grep -q '"status": "valid"'

      - name: Qualify fail-closed admission HTTPS
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          state="$root/state"
          cert="$root/tls.crt"
          key="$root/tls.key"
          review="$root/review.json"
          bin="$PWD/target/release/vollcrypt-shield-container"
          digest="sha256:$(printf c%.0s {1..64})"
          cleanup() {
            if test -n "${admission_pid:-}"; then
              kill "$admission_pid" >/dev/null 2>&1 || true
              wait "$admission_pid" >/dev/null 2>&1 || true
            fi
            case "$root" in
              /tmp/tmp.*) rm -rf -- "$root" ;;
            esac
          }
          trap cleanup EXIT

          "$bin" init --state-dir "$state" --scope admission-ci
          "$bin" approve-admission --state-dir "$state" \
            --namespace production --image-digest "$digest"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$key" -out "$cert" -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost' >/dev/null 2>&1
          printf '{"apiVersion":"admission.k8s.io/v1","kind":"AdmissionReview","request":{"uid":"ci-request","namespace":"production","operation":"CREATE","object":{"apiVersion":"v1","kind":"Pod","spec":{"containers":[{"name":"app","image":"registry.example/app@%s"}]}}}}' \
            "$digest" >"$review"
          "$bin" admission-check --state-dir "$state" --review "$review" \
            | grep -q '"allowed": true'

          "$bin" serve-admission --state-dir "$state" \
            --listen 127.0.0.1:9443 --tls-cert "$cert" --tls-key "$key" &
          admission_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent --cacert "$cert" \
              https://localhost:9443/healthz >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent --cacert "$cert" \
            -H 'content-type: application/json' --data-binary "@$review" \
            https://localhost:9443/validate | grep -q '"allowed":true'

          sed -i 's#registry.example/app@sha256:[c]*#registry.example/app:latest#' "$review"
          curl --fail --silent --cacert "$cert" \
            -H 'content-type: application/json' --data-binary "@$review" \
            https://localhost:9443/validate | grep -q '"allowed":false'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cacert "$cert" -H 'content-type: application/json' --data '{}' \
            https://localhost:9443/validate)" = 400
          kill "$admission_pid"
          wait "$admission_pid" || true
          admission_pid=
          "$bin" runtime-audit-verify --state-dir "$state" --runtime admission \
            | grep -q '"status": "valid"'

  linux-distro-qualification:
    name: Shield (Debian 13)
    runs-on: ubuntu-24.04
    container: debian:trixie-20260713@sha256:fac46bff2e02f51425b6e33b0e1169f55dfb053d83511ca28aa50c09fd5ed7a4
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl file git libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config wget

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Test Shield agent and CLI
        run: cargo test --locked -p vollcrypt-shield-core -p vollcrypt-shield-protocol -p vollcrypt-shield-windows -p vollcrypt-shield-fs -p vollcrypt-shield-cli

      - name: Build release CLI
        run: cargo build --locked --release -p vollcrypt-shield-cli

      - name: Run unrestricted watcher and Debian package smoke
        run: |
          bash vollcrypt-shield/scripts/linux-qualification.sh \
            target/release/vollcrypt-shield debian13

      - name: Build and test Node binding
        working-directory: vollcrypt-shield/bindings/node
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          npm test

      - name: Build and test Viewer
        working-directory: vollcrypt-shield/desktop-app
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  windows-arm64-qualification:
    name: Shield (Windows 11 ARM64)
    runs-on: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Test agent and CLI
        run: cargo test --locked -p vollcrypt-shield-core -p vollcrypt-shield-protocol -p vollcrypt-shield-windows -p vollcrypt-shield-fs -p vollcrypt-shield-cli

      - name: Build release CLI
        run: cargo build --locked --release -p vollcrypt-shield-cli

      - name: Build and test Node binding
        working-directory: vollcrypt-shield/bindings/node
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          npm test

      - name: Build and test Viewer
        working-directory: vollcrypt-shield/desktop-app
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  quality:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Enforce public and commercial source boundary
        shell: bash
        run: |
          test "$(git ls-files vollcrypt-shield/control-plane)" = "vollcrypt-shield/control-plane/README.md"
          ! git grep -n 'name = "vollcrypt-shield-control-plane"' -- '*.toml' '*.rs'

      - name: Lint Shield
        run: cargo clippy --locked -p vollcrypt-shield-core -p vollcrypt-shield-protocol -p vollcrypt-shield-witness -p vollcrypt-shield-windows -p vollcrypt-shield-fs -p vollcrypt-shield-container -p vollcrypt-shield-db -p vollcrypt-shield-embedded -p vollcrypt-shield-cli -p vollcrypt-shield-core-node -p vollcrypt-scan-core -p vollcrypt-shield-classifier --all-targets -- -D warnings

  node-binding:
    name: Node Binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, windows-2022, windows-2025]
    defaults:
      run:
        working-directory: vollcrypt-shield/bindings/node
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vollcrypt-shield/bindings/node/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build binding
        run: npm run build

      - name: Test binding
        run: npm test

  viewer:
    name: Shield Viewer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, windows-2022, windows-2025]
    defaults:
      run:
        working-directory: vollcrypt-shield/desktop-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vollcrypt-shield/desktop-app/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Test independent verifier
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Viewer backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
