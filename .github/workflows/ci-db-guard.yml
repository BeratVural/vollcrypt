name: DB Guard CI

on:
  push:
    branches: ["main"]
    paths:
      - "db-guard/**"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-db-guard.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "db-guard/**"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-db-guard.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  node:
    name: Build and Test Node Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build db-guard
        run: npm run build --workspace @vollcrypt/db-guard

      - name: Test db-guard
        run: npm test --workspace @vollcrypt/db-guard

  rust:
    name: Test Rust Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove wave submodule from Cargo.toml for CI
        run: python -c "lines = [line for line in open('Cargo.toml') if 'vollcrypt-wave' not in line]; open('Cargo.toml', 'w').write(''.join(lines))"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test db-guard Rust crate
        run: cargo test -p vollcrypt-db-guard --features pkcs11
