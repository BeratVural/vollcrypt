name: Vollcrypt Shield Soak

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Watcher soak duration in seconds (minimum 30)"
        required: true
        default: "900"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  watcher-notification-soak:
    name: Watcher and notification soak
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Test webhook and durable log burst
        run: cargo test --locked -p vollcrypt-shield-fs notification_delivery_soak
      - name: Build release CLI
        run: cargo build --locked --release -p vollcrypt-shield-cli
      - name: Run live watcher soak
        env:
          SOAK_DURATION: ${{ inputs.duration_seconds || '900' }}
        run: bash vollcrypt-shield/scripts/watcher-soak.sh target/release/vollcrypt-shield "$SOAK_DURATION"
