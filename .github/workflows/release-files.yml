name: Vollcrypt Files Release

on:
  push:
    tags:
      - "files-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  # Files Module Releases
  build-files-node:
    name: Build Files Node Bindings
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Dependencies
        run: cd vollcrypt-files/node && npm ci

      - name: Build Node
        run: cd vollcrypt-files/node && npx @napi-rs/cli build --platform --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: files-bindings-${{ matrix.target }}
          path: vollcrypt-files/node/vollcrypt-files-node.*.node
          if-no-files-found: error

  package-files-node:
    name: Package @vollcrypt/files-node
    needs: build-files-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: vollcrypt-files/node/
          pattern: files-bindings-*
          merge-multiple: true

      - name: Install Rust for SBOM generation
        uses: dtolnay/rust-toolchain@stable

      - name: Generate CycloneDX SBOM
        run: node scripts/generate-cargo-sbom.js vollcrypt-files/node/Cargo.toml vollcrypt-files/node/package.json vollcrypt-files/node/sbom.cdx.json

      - name: List binaries
        run: ls -la vollcrypt-files/node/vollcrypt-files-node.*.node

      - name: Create npm package
        run: |
          mkdir -p dist-packages
          cd vollcrypt-files/node
          npm pack --pack-destination ../../dist-packages

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: files-node-npm-package
          path: dist-packages/*.tgz
          if-no-files-found: error

      - name: Attest npm package provenance
        uses: actions/attest@v4
        with:
          subject-path: dist-packages/*.tgz

      - name: Attest npm package SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist-packages/*.tgz
          sbom-path: vollcrypt-files/node/sbom.cdx.json

  package-files-wasm:
    name: Package Files WASM Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Install Dependencies
        run: npm ci

      - name: Build WASM
        run: npm run build:files:wasm

      - name: Generate CycloneDX SBOM
        run: node scripts/generate-cargo-sbom.js vollcrypt-files/wasm/Cargo.toml vollcrypt-files/wasm/package.json vollcrypt-files/wasm/sbom.cdx.json

      - name: Create npm package
        run: |
          mkdir -p dist-packages
          cd vollcrypt-files/wasm
          npm pack --pack-destination ../../dist-packages

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: files-wasm-npm-package
          path: dist-packages/*.tgz
          if-no-files-found: error

      - name: Attest npm package provenance
        uses: actions/attest@v4
        with:
          subject-path: dist-packages/*.tgz

      - name: Attest npm package SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist-packages/*.tgz
          sbom-path: vollcrypt-files/wasm/sbom.cdx.json
  publish-files-node:
    name: Publish @vollcrypt/files-node
    if: startsWith(github.ref, 'refs/tags/files-v')
    needs: package-files-node
    runs-on: ubuntu-latest
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download npm package
        uses: actions/download-artifact@v8
        with:
          name: files-node-npm-package
          path: dist-packages

      - name: Publish with npm provenance
        run: npm publish ./dist-packages/*.tgz --access public --provenance

  publish-files-wasm:
    name: Publish @vollcrypt/files-wasm
    if: startsWith(github.ref, 'refs/tags/files-v')
    needs: package-files-wasm
    runs-on: ubuntu-latest
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download npm package
        uses: actions/download-artifact@v8
        with:
          name: files-wasm-npm-package
          path: dist-packages

      - name: Publish with npm provenance
        run: npm publish ./dist-packages/*.tgz --access public --provenance
