name: Vollcrypt Shield Windows Recovery

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  strict-recovery:
    name: Strict recovery (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-server-2022-x86_64
            runner: windows-2022
          - platform: windows-server-2025-x86_64
            runner: windows-2025
          - platform: windows-11-arm64
            runner: windows-11-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Run strict active-response recovery qualification
        shell: pwsh
        run: ./vollcrypt-shield/scripts/windows-recovery-qualification.ps1 -EvidenceDirectory "qualification-evidence/${{ matrix.platform }}"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shield-recovery-${{ matrix.platform }}
          path: qualification-evidence/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30
