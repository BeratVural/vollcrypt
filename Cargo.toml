[workspace]
members = [
    "vollcrypt-messages/core",
    "vollcrypt-messages/node",
    "vollcrypt-messages/wasm",
    "vollcrypt-files/core",
    "vollcrypt-files/node",
    "vollcrypt-files/wasm",
    "vollcrypt-files/bench",
    "vollcrypt-files/stress",
    "vollcrypt-files/adversarial",
    "vollcrypt-desktop/src-tauri",
    "db-guard/rust",
    "vollcrypt-shield/core",
    "vollcrypt-shield/agents/fs",
    "vollcrypt-shield/agents/container",
    "vollcrypt-shield/agents/db",
    "vollcrypt-shield/agents/embedded",
    "vollcrypt-shield/cli",
    "vollcrypt-shield/bindings/node",
    "vollcrypt-shield/desktop-app/src-tauri",
    "vollcrypt-shield/protocol",
    "vollcrypt-shield/witness",
    "vollcrypt-shield/platform/windows",
    "vollcrypt-scan/core",
    "vollcrypt-scan/shield-classifier",
]
exclude = ["vollcrypt-wave"]
resolver = "2"

[workspace.package]
license = "GPL-3.0-only OR LicenseRef-Commercial"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[patch.crates-io]
ml-kem = { path = "./ml-kem" }
