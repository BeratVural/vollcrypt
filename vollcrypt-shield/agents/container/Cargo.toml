[package]
name = "vollcrypt-shield-container"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only OR LicenseRef-Commercial"
description = "Self-contained OCI image-layout integrity scanner for Vollcrypt Shield"

[dependencies]
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
minicbor = { version = "2.3", features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
vollcrypt-shield-core = { version = "1.0.0", path = "../../core" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "vollcrypt-shield-container"
path = "src/main.rs"
