[package]
name = "vollcrypt-shield-db"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only OR LicenseRef-Commercial"
description = "Self-contained database record integrity agent for Vollcrypt Shield"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
vollcrypt-shield-core = { version = "0.1.0", path = "../../core" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "vollcrypt-shield-db"
path = "src/main.rs"
