[package]
name = "vollcrypt-shield-witness"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only OR LicenseRef-Commercial"
description = "Independent Vollcrypt Shield witness node"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
minicbor = { version = "2.3", features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
vollcrypt-shield-core = { version = "1.0.0", path = "../core" }
vollcrypt-shield-protocol = { version = "1.0.0", path = "../protocol" }

[dev-dependencies]
tempfile = "3"
vollcrypt-shield-fs = { path = "../agents/fs" }
