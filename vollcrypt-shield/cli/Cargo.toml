[package]
name = "vollcrypt-shield-cli"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only OR LicenseRef-Commercial"
description = "Self-contained CLI for the Vollcrypt Shield filesystem agent"

[[bin]]
name = "vollcrypt-shield"
path = "src/main.rs"

[dependencies]
vollcrypt-shield-core = { version = "1.0.0", path = "../core" }
vollcrypt-shield-fs = { version = "1.0.0", path = "../agents/fs" }
vollcrypt-shield-protocol = { version = "1.0.0", path = "../protocol" }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29.0"
hex = "0.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde_json = "1"
sha2 = "0.10"
similar = "2.7.0"

[dev-dependencies]
tempfile = "3"
