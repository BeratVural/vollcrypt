[package]
name = "vollcrypt-shield-protocol"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only OR LicenseRef-Commercial"
description = "Pairing and witness protocols for Vollcrypt Shield"

[dependencies]
getrandom = "0.4"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
minicbor = { version = "2.3", features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
spake2 = "=0.4.0"
subtle = "2.6"
thiserror = "2"
vollcrypt-shield-core = { version = "1.0.0", path = "../core" }
zeroize = { version = "1.8", features = ["derive"] }
